name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.before != '0000000000000000000000000000000000000000' &&
      !contains(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - name: Validate release
        run: |
          npm run format:check
          npm test
          npm run build:demo
          npm run test:package
          npm audit
          npx playwright install --with-deps chrome
          npm run test:browser
      - name: Commit version and tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release $version"
          git tag "$version"
          git push origin HEAD:main "$version"
      - name: Publish tested archive
        run: |
          packages=(artifacts/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "./${packages[0]}" --access public --ignore-scripts
